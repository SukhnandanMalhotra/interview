app {
  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}
    port = 8080
    port = ${?HTTP_PORT}
    timeout = 40 seconds
  }
  one-frame {
    host = "localhost"
    host = ${?ONE_FRAME_HOST}
    port = 8081
    port = ${?ONE_FRAME_PORT}
    token = ${ONE_FRAME_TOKEN}
    # MUST be <= 5 minutes — Forex.md requires rates not older than 5 minutes.
    # Lowering this increases One-Frame quota usage (288 refreshes/day at 5 min).
    cache-ttl-minutes = 5
    # Circuit breaker trips after this many consecutive fetch failures.
    cb-max-failures = 3
    # How long (seconds) the circuit stays open before allowing a probe request.
    cb-reset-timeout-seconds = 30
  }
}

